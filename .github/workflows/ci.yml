name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  # ── 后端：编译 + vet + 单测（race）────────────────────────────────
  backend:
    name: backend (build / vet / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # 测试不在这里跑：项目里没有任何测试使用 testing.Short()，
      # 所以 "-race -short" 与下面 integration job 的 "-tags integration"
      # 跑的是同一批用例（后者是超集）。重复跑一遍只是多花 3 分钟。
      # 全部测试集中在 backend-integration job（带 -race）。

  # ── 集成测试：golden / 真实 SQL / 容器契约 ──────────────────────────
  # 这些测试打了 //go:build integration，-short 跑不到。
  # 它们覆盖的是"编译期看不出来"的错误：row 结构漏列、内嵌结构不导出导致
  # 主键静默为零、outbox 中继租约恢复、日志管道落盘。之前一直没有 CI job，
  # 等于这些保护只在开发机手动跑过。
  #
  # 用一个 MySQL service 供所有测试包共用：testkit 的 sync.Once 是包级的、
  # 每个包是独立进程，不共用的话 12 个包各起一个容器，并行时互相拖垮。
  backend-integration:
    name: backend (integration)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # ClickHouse 那批仍用 testcontainers，需要 Docker：runner 自带，这里断言一下，
      # 免得哪天镜像变了变成静默跳过。
      - name: 确认 Docker 可用（ClickHouse 容器测试的依赖）
        run: docker info

      # 一次跑全部测试：-tags integration 已包含所有非 integration 用例，
      # -race 保留（本地可用 BLOGX_FAST=1 跳过，CI 不应该跳过）。
      #
      # -count=1 等价于 BLOGX_NO_CACHE=1：强制真跑，不复用测试结果缓存。
      # CI 本来就没有历史缓存，但显式写出来，避免有人以为"绿了"是缓存给的。
      - name: go test (race, integration)
        env:
          BLOGX_MYSQL_ADDR: 127.0.0.1:3306
        run: go test -race -tags integration -count=1 -timeout 25m ./...

  # ── 架构守卫：AST 规则（先 warn，逐步升级 error）─────────────────
  archcheck:
    name: backend (archcheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # 规则自身的单测：每条规则都必须能在人造违规上报错
      - name: archcheck rules self-test
        run: go test ./tools/archcheck/...

      # 棘轮：基线定义在 scripts/arch-baseline.env，本地门禁 / CI / 自检脚本
      # 三处都读它。这里绝不写死数字 —— 之前 CI 停在 250 而本地已是 0，
      # 等于 CI 允许新增 250 处违规，棘轮失去意义。
      - name: archcheck (ratchet)
        working-directory: .
        run: |
          . scripts/arch-baseline.env
          echo "棘轮基线：$ARCH_MAX_VIOLATIONS"
          cd backend
          go run ./tools/archcheck --mode=error --max-violations="$ARCH_MAX_VIOLATIONS" .

      # 第二遍包含 _test.go：默认的 -skip-tests 会跳过测试文件，
      # 而测试里 import models 会卡住 M6 的"删 models"，那种违规别处不报警。
      - name: archcheck (ratchet, 含测试文件)
        working-directory: .
        run: |
          . scripts/arch-baseline.env
          cd backend
          go run ./tools/archcheck --mode=error --skip-tests=false --max-violations="$ARCH_MAX_VIOLATIONS" .

  # ── 契约：生成产物必须与代码注解一致 ────────────────────────────────
  # 为什么需要这个 job：契约是前后端唯一的耦合点。有人改了 Go 注解却忘了
  # 跑 `make openapi`，docs/swagger.json 就会静默过期，前端类型照着过期契约
  # 生成 —— 门禁全绿，但契约是错的，而且没有任何信号。
  #
  # 判据是"重新生成后 git 无差异"，而不是"能生成"。
  contract:
    name: backend (contract up-to-date)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # 必须与 Makefile 注释里写的版本一致，否则产物格式会漂移。
      - name: 安装 swag v2
        run: go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc6

      # 先把依赖下全，再让 swag 跑。
      #
      # 不加这一步会偶发失败在 `cannot find all dependencies, <nil>`：
      # swag 带 --parseDependency 时会自己调 `go list -deps`，而这次调用与
      # 模块下载是并发的（日志里能看到一堆 go: downloading 之后立刻报错）。
      # 下载慢一点或者有一次抖动，解析就拿到不完整的依赖图 —— 而 swag 的报错
      # 只说"找不到依赖"，看不出是网络问题，非常容易误判成注解写错。
      # 单独一步下载，失败原因就落在这一步，且失败会明确指着 go.sum。
      - name: 下载 Go 依赖
        run: go mod download

      - name: 重新生成契约
        run: make openapi

      - name: 契约必须与提交内容一致
        working-directory: .
        run: |
          if ! git diff --exit-code backend/docs/swagger.json; then
            echo ""
            echo "✗ docs/swagger.json 与代码注解不一致。"
            echo "  请在本地执行 cd backend && make openapi 并提交产物。"
            echo "  否则前端类型会照着过期契约生成，门禁却全绿。"
            exit 1
          fi

  # ── 前端 lint（两端解耦，矩阵并行）────────────────────────────────
  frontend-lint:
    name: ${{ matrix.app }} (lint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend_admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # 固定时区。runner 默认 UTC，而前端有用例断言"某个时刻显示成 3 点"——
    # 同一份 +08:00 的输入在 UTC 下会被换算成前一天 19 点，于是本地绿、CI 红。
    # 这四个前端 job 统一钉成东八区，让时间断言的语义与项目实际部署时区一致。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      # 模板里的自定义组件能不能解析到。这类缺陷 lint / vue-tsc / vitest 都看不见：
      # components/settings/AiProviderList.vue 实际注册名是 SettingsAiProviderList，
      # 组件里写 <AiProviderList /> 编译与类型都不报错，只在运行时 resolveComponent
      # 失败 → 整块 UI 静默不渲染（线上「AI 模型配置」就这样消失过）。
      # 依赖 pnpm install 触发的 nuxt prepare 生成 .nuxt/components.d.ts。
      - name: 模板组件解析检查
        run: pnpm check:components

      # 设计 token 漂移门禁：app/** 不许出现裸 hex / rgba，颜色只能来自 tokens.css
      # 的语义层。baseline 已在 #13 清空为 0 —— 此后任何新增裸色值直接失败。
      # 与本地 scripts/check.sh 的 frontend 段保持同一口径（不在这里另写一份规则）。
      - name: 设计 token 漂移检查
        run: pnpm check:tokens

  # ── 前端类型检查 ──────────────────────────────────────────────────
  frontend-typecheck:
    name: ${{ matrix.app }} (typecheck)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend_admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # 固定时区，理由见 frontend-lint 里的说明。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  # ── 契约 → 前端派生类型：必须重新生成过 ──────────────────────────
  # 上一个 job 保证 swagger.json 与 Go 注解一致；这个 job 保证两个 app 的
  # app/types/openapi.d.ts 是从这份 swagger.json 生成的。
  #
  # 为什么需要两个 job：只校验 swagger.json 时，改了注解 → 生成契约 → 忘了
  # `pnpm openapi:types`，门禁全绿而前端仍照着旧类型编译。
  # 那正是"契约过期"的失效模式，只是下移了一层（从 .go 移到 .d.ts）。
  contract-types:
    name: ${{ matrix.app }} (contract types up-to-date)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend_admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # 固定时区，理由见 frontend-lint 里的说明。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 重新生成到临时文件再比对（不是在原地生成后 git diff）：
      # 后者把结论绑在工作区状态上，且会改动被检查的文件。
      - name: 重新生成契约类型到临时文件
        run: pnpm exec openapi-typescript ../backend/docs/swagger.json -o /tmp/openapi.d.ts

      - name: 必须与提交内容一致
        run: |
          if ! diff -q /tmp/openapi.d.ts app/types/openapi.d.ts; then
            echo ""
            echo "✗ app/types/openapi.d.ts 与 backend/docs/swagger.json 不一致。"
            echo "  请在本地执行 cd ${{ matrix.app }} && pnpm openapi:types 并把产物一起提交。"
            echo "  否则前端会照着过期契约编译，而门禁却全绿。"
            echo ""
            diff -u app/types/openapi.d.ts /tmp/openapi.d.ts | head -40
            exit 1
          fi

  # ── 前端单测 ──────────────────────────────────────────────────────
  frontend-test:
    name: ${{ matrix.app }} (test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend_admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # 固定时区，理由见 frontend-lint 里的说明。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 跑测试并卡覆盖率门槛（两端配置各自的统计范围）。
      # 曾经这里只跑 `pnpm test`：管理后台 0 用例 + passWithNoTests，
      # 那一项等于空转 —— 门禁给了一个它并没有提供的保障。
      - run: pnpm test:coverage

  # ── 门禁自检：故意注入失败，CI 必须变红 ───────────────────────────
  # 这个 job 存在的意义：证明上面所有 job 真的会失败。
  # 如果它们只是"永远绿"，那么整套 CI 等于不存在。
  gates-canary:
    name: gates canary (must fail)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 只有在 PR 标题带 [canary] 时才验证"能变红"，
      # 避免每次 PR 都付出额外几分钟。
      #
      # 这里**调用与本地同一个脚本**，而不是在 YAML 里另写一份注入逻辑。
      # 之前 CI 只注入了"一个必败测试"，等于 11 道门禁里只验证了 1 道 ——
      # 而两处各写一份的必然结果是口径漂移（本地 11 道、CI 1 道，没人知道该信哪个）。
      - name: 仅在 canary PR 上验证门禁有效性
        if: contains(github.event.pull_request.title, '[canary]')
        env:
          CGO_ENABLED: "1"
        run: |
          go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc6
          ( cd frontend && pnpm install --frozen-lockfile )
          ( cd frontend_admin && pnpm install --frozen-lockfile )
          bash scripts/verify-gates.sh
