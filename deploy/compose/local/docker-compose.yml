services:
  mysql-master:
    image: "mysql:8.0"
    container_name: mysql-master
    restart: unless-stopped
    privileged: true
    environment:
      MYSQL_ROOT_PASSWORD: "${BLOGX_DB_PASSWORD}"
      TZ: "${TZ}"
      MYSQL_DATABASE: "${BLOGX_DB_NAME}"
      BLOGX_DB_USER: "${BLOGX_DB_USER}"
      BLOGX_DB_PASSWORD: "${BLOGX_DB_PASSWORD}"
      BLOGX_DB_REPL_USER: "${BLOGX_DB_REPL_USER}"
      BLOGX_DB_REPL_PASSWORD: "${BLOGX_DB_REPL_PASSWORD}"
    command:
    # my.cnf 必须先复制成 644 再让 MySQL 读：MySQL 会忽略"所有用户可写"的
    # 配置文件（只警告不报错），Windows 上 Docker Desktop 把挂载文件映射成 777，
    # 于是 gtid_mode=ON 静默失效、从库 SOURCE_AUTO_POSITION=1 直接报 1777。
    # 详见 production compose 里的同一段注释。
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /etc/mysql/my.cnf.from-host /etc/mysql/my.cnf
        chmod 644 /etc/mysql/my.cnf
        exec docker-entrypoint.sh mysqld
    ports:
      - "${BLOGX_DB_MASTER_PORT}:3306"
    volumes:
      - ../../docker/mysql/master/my.cnf:/etc/mysql/my.cnf.from-host:ro
      - ../../state/mysql/master/mysql-files:/var/lib/mysql-files
      - ../../state/mysql/master/data:/var/lib/mysql
      - ../../state/mysql/master/log:/var/log/
      - ../../docker/mysql/master/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysql -h127.0.0.1 -P3306 --protocol=TCP --ssl-mode=DISABLED -u"$${BLOGX_DB_USER}" -p"$${BLOGX_DB_PASSWORD}" -D"$${MYSQL_DATABASE}" -e "SELECT 1" > /dev/null 2>&1 || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - blogx_network

  mysql-slave:
    image: "mysql:8.0"
    container_name: mysql-slave
    restart: unless-stopped
    privileged: true
    environment:
      MYSQL_ROOT_PASSWORD: "${BLOGX_DB_PASSWORD}"
      TZ: "${TZ}"
      BLOGX_DB_NAME: "${BLOGX_DB_NAME}"
      BLOGX_DB_USER: "${BLOGX_DB_USER}"
      BLOGX_DB_PASSWORD: "${BLOGX_DB_PASSWORD}"
      BLOGX_DB_REPL_USER: "${BLOGX_DB_REPL_USER}"
      BLOGX_DB_REPL_PASSWORD: "${BLOGX_DB_REPL_PASSWORD}"
    command:
    # 与 mysql-master 同款包装，理由见上面的注释。
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /etc/mysql/my.cnf.from-host /etc/mysql/my.cnf
        chmod 644 /etc/mysql/my.cnf
        exec docker-entrypoint.sh mysqld
    ports:
      - "${BLOGX_DB_REPLICA_PORT}:3306"
    volumes:
      - ../../docker/mysql/slave/my.cnf:/etc/mysql/my.cnf.from-host:ro
      - ../../state/mysql/slave/mysql-files:/var/lib/mysql-files
      - ../../state/mysql/slave/data:/var/lib/mysql
      - ../../state/mysql/slave/log:/var/log/
      - ../../docker/mysql/slave/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    depends_on:
      mysql-master:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysql -h127.0.0.1 -P3306 --protocol=TCP --ssl-mode=DISABLED -u"$${BLOGX_DB_USER}" -p"$${BLOGX_DB_PASSWORD}" -D"$${BLOGX_DB_NAME}" -e "SELECT 1" > /dev/null 2>&1 || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - blogx_network

  es:
    build:
      context: ../../..
      dockerfile: deploy/docker/es/Dockerfile
    image: "myblogx-elasticsearch:7.12.0"
    pull_policy: never
    container_name: es
    restart: unless-stopped
    privileged: true
    environment:
      # 同生产编排：TAKE_FILE_OWNERSHIP 是官方给 bind mount 场景准备的开关，
      # 非空时 entrypoint 会先 chown -R 1000:0 data/logs 再降权运行 ES。
      TAKE_FILE_OWNERSHIP: "true"
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "true"
      xpack.security.transport.ssl.enabled: "true"
      http.cors.enabled: true
      http.cors.allow-origin: "*"
      http.cors.allow-headers: "X-Requested-With,Content-Type,Authorization"
      ELASTIC_PASSWORD: "${BLOGX_ES_PASSWORD}"
    ports:
      - "${BLOGX_ES_PORT}:9200"
    volumes:
      - ../../state/es/data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://127.0.0.1:9200/_cluster/health?wait_for_status=green&timeout=5s > /dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks:
      - blogx_network

  redis:
    image: "redis:7.4.7"
    container_name: redis
    restart: unless-stopped
    privileged: true
    environment:
      BLOGX_REDIS_PASSWORD: "${BLOGX_REDIS_PASSWORD}"
    command: ["/bin/sh", "/etc/redis/render-config.sh"]
    ports:
      - "${BLOGX_REDIS_PORT}:6379"
    volumes:
      - ../../state/redis/data:/data
      - ../../docker/redis/conf/redis.conf.tmpl:/etc/redis/redis.conf.tmpl:ro
      - ../../docker/redis/conf/render-config.sh:/etc/redis/render-config.sh:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${BLOGX_REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - blogx_network

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    container_name: clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: "${BLOGX_CLICKHOUSE_DB}" # 初始化创建的默认数据库（与日志库一致）
      CLICKHOUSE_PASSWORD: "${BLOGX_CLICKHOUSE_PASSWORD}" # 默认登录密码（与 Fluent Bit 配置一致）
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT}" # 开启默认权限管理，允许远程连接和账号管理
    ports:
      # HTTP 接口端口（Fluent Bit 写入用）
      - 8123:8123
      # 原生 TCP 端口（客户端连接、程序直连用）
      - 9000:9000
    volumes:
      - ../../state/clickhouse/data:/var/lib/clickhouse
      - ../../state/clickhouse/logs:/var/log/clickhouse-server
      - ../../docker/clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'clickhouse-client --user default --password "$${CLICKHOUSE_PASSWORD}" --query "SELECT 1" || exit 1',
        ]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - blogx_network

  blogx_server:
    container_name: blogx-server
    image: "blogx-server:6"
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: deploy/docker/api/Dockerfile
    environment:
      TZ: "${TZ}"
      BLOGX_SERVER_ID: "${BLOGX_SERVER_ID}"
      BLOGX_APP_HOST: "${BLOGX_APP_HOST}"
      BLOGX_APP_PORT: "${BLOGX_APP_PORT}"
      BLOGX_APP_ENV: "${BLOGX_APP_ENV}"
      BLOGX_GIN_MODE: "${BLOGX_GIN_MODE}"
      BLOGX_LOG_APP: "${BLOGX_LOG_APP}"
      BLOGX_LOG_LEVEL: "${BLOGX_LOG_LEVEL}"
      BLOGX_LOG_REQUEST_LOG_ENABLED: "${BLOGX_LOG_REQUEST_LOG_ENABLED}"
      BLOGX_LOG_QUERY_DEFAULT_LIMIT: "${BLOGX_LOG_QUERY_DEFAULT_LIMIT}"
      BLOGX_LOG_QUERY_MAX_LIMIT: "${BLOGX_LOG_QUERY_MAX_LIMIT}"
      BLOGX_LOG_CLEANUP_ENABLED: "${BLOGX_LOG_CLEANUP_ENABLED}"
      BLOGX_LOG_RETENTION_DAYS: "${BLOGX_LOG_RETENTION_DAYS}"
      BLOGX_LOG_CLEANUP_RUN_AT: "${BLOGX_LOG_CLEANUP_RUN_AT}"
      BLOGX_JWT_SECRET: "${BLOGX_JWT_SECRET}"
      BLOGX_JWT_ISSUER: "${BLOGX_JWT_ISSUER}"
      BLOGX_JWT_EXPIRE_HOURS: "${BLOGX_JWT_EXPIRE_HOURS}"
      BLOGX_JWT_REFRESH_EXPIRE_HOURS: "${BLOGX_JWT_REFRESH_EXPIRE_HOURS}"
      BLOGX_DB_NAME: "${BLOGX_DB_NAME}"
      BLOGX_DB_USER: "${BLOGX_DB_USER}"
      BLOGX_DB_PASSWORD: "${BLOGX_DB_PASSWORD}"
      BLOGX_DB_MASTER_HOST: "mysql-master"
      BLOGX_DB_MASTER_PORT: "3306"
      BLOGX_DB_REPLICA_HOST: "mysql-slave"
      BLOGX_DB_REPLICA_PORT: "3306"
      BLOGX_GORM_DEBUG: "${BLOGX_GORM_DEBUG}"
      BLOGX_GORM_MAX_IDLE_CONNS: "${BLOGX_GORM_MAX_IDLE_CONNS}"
      BLOGX_GORM_MAX_OPEN_CONNS: "${BLOGX_GORM_MAX_OPEN_CONNS}"
      BLOGX_GORM_CONN_MAX_LIFETIME_HOURS: "${BLOGX_GORM_CONN_MAX_LIFETIME_HOURS}"
      BLOGX_REDIS_HOST: "redis"
      BLOGX_REDIS_PORT: "6379"
      BLOGX_REDIS_USERNAME: "${BLOGX_REDIS_USERNAME}"
      BLOGX_REDIS_PASSWORD: "${BLOGX_REDIS_PASSWORD}"
      BLOGX_REDIS_DB: "${BLOGX_REDIS_DB}"
      BLOGX_ES_URL: "http://es:9200"
      BLOGX_ES_ADDR: "es:9200"
      BLOGX_ES_INDEX: "${BLOGX_ES_INDEX}"
      BLOGX_ES_USERNAME: "${BLOGX_ES_USERNAME}"
      BLOGX_ES_PASSWORD: "${BLOGX_ES_PASSWORD}"
      BLOGX_ES_USE_HTTPS: "${BLOGX_ES_USE_HTTPS}"
      BLOGX_CLICKHOUSE_ADDR: "clickhouse:9000"
      BLOGX_CLICKHOUSE_DB: "${BLOGX_CLICKHOUSE_DB}"
      BLOGX_CLICKHOUSE_USERNAME: "${BLOGX_CLICKHOUSE_USERNAME}"
      BLOGX_CLICKHOUSE_PASSWORD: "${BLOGX_CLICKHOUSE_PASSWORD}"
      BLOGX_CLICKHOUSE_DIAL_TIMEOUT_SEC: "${BLOGX_CLICKHOUSE_DIAL_TIMEOUT_SEC}"
      BLOGX_CLICKHOUSE_MAX_OPEN_CONNS: "${BLOGX_CLICKHOUSE_MAX_OPEN_CONNS}"
      BLOGX_CLICKHOUSE_MAX_IDLE_CONNS: "${BLOGX_CLICKHOUSE_MAX_IDLE_CONNS}"
      BLOGX_RIVER_ENABLED: "${BLOGX_RIVER_ENABLED}"
      BLOGX_RIVER_SERVER_ID: "${BLOGX_RIVER_SERVER_ID}"
      BLOGX_RIVER_MYSQL_ADDR: "mysql-master:3306"
      BLOGX_RIVER_MYSQL_USER: "${BLOGX_RIVER_MYSQL_USER}"
      BLOGX_RIVER_MYSQL_PASSWORD: "${BLOGX_RIVER_MYSQL_PASSWORD}"
      BLOGX_IMAGE_REF_RIVER_ENABLED: "${BLOGX_IMAGE_REF_RIVER_ENABLED}"
      BLOGX_IMAGE_REF_RIVER_SERVER_ID: "${BLOGX_IMAGE_REF_RIVER_SERVER_ID}"
      BLOGX_IMAGE_REF_RIVER_SCHEMA: "${BLOGX_IMAGE_REF_RIVER_SCHEMA}"
      BLOGX_IMAGE_REF_RIVER_MYSQL_ADDR: "mysql-master:3306"
      BLOGX_IMAGE_REF_RIVER_MYSQL_USER: "${BLOGX_IMAGE_REF_RIVER_MYSQL_USER}"
      BLOGX_IMAGE_REF_RIVER_MYSQL_PASSWORD: "${BLOGX_IMAGE_REF_RIVER_MYSQL_PASSWORD}"
      BLOGX_UPLOAD_SIZE_MB: "${BLOGX_UPLOAD_SIZE_MB}"
      BLOGX_UPLOAD_DIR: "${BLOGX_UPLOAD_DIR}"
      BLOGX_SMTP_HOST: "${BLOGX_SMTP_HOST}"
      BLOGX_SMTP_PORT: "${BLOGX_SMTP_PORT}"
      BLOGX_SMTP_USERNAME: "${BLOGX_SMTP_USERNAME}"
      BLOGX_SMTP_AUTH_CODE: "${BLOGX_SMTP_AUTH_CODE}"
      BLOGX_SMTP_FROM_NAME: "${BLOGX_SMTP_FROM_NAME}"
      BLOGX_SMTP_SSL: "${BLOGX_SMTP_SSL}"
      BLOGX_SMTP_TLS: "${BLOGX_SMTP_TLS}"
      BLOGX_QQ_APP_ID: "${BLOGX_QQ_APP_ID}"
      BLOGX_QQ_APP_KEY: "${BLOGX_QQ_APP_KEY}"
      BLOGX_QQ_REDIRECT: "${BLOGX_QQ_REDIRECT}"
      BLOGX_QINIU_ENABLED: "${BLOGX_QINIU_ENABLED}"
      BLOGX_QINIU_ACCESS_KEY: "${BLOGX_QINIU_ACCESS_KEY}"
      BLOGX_QINIU_SECRET_KEY: "${BLOGX_QINIU_SECRET_KEY}"
      BLOGX_QINIU_BUCKET: "${BLOGX_QINIU_BUCKET}"
      BLOGX_QINIU_DOMAIN: "${BLOGX_QINIU_DOMAIN}"
      BLOGX_QINIU_REGION: "${BLOGX_QINIU_REGION}"
      BLOGX_QINIU_PREFIX: "${BLOGX_QINIU_PREFIX}"
      BLOGX_QINIU_MAX_SIZE_MB: "${BLOGX_QINIU_MAX_SIZE_MB}"
      BLOGX_QINIU_TOKEN_EXPIRY_SEC: "${BLOGX_QINIU_TOKEN_EXPIRY_SEC}"
      BLOGX_QINIU_CALLBACK_URL: "${BLOGX_QINIU_CALLBACK_URL}"
      BLOGX_SITE_MODE: "${BLOGX_SITE_MODE}"
      BLOGX_LOGIN_QQ_ENABLED: "${BLOGX_LOGIN_QQ_ENABLED}"
      BLOGX_LOGIN_USERNAME_PASSWORD_ENABLED: "${BLOGX_LOGIN_USERNAME_PASSWORD_ENABLED}"
      BLOGX_LOGIN_EMAIL_ENABLED: "${BLOGX_LOGIN_EMAIL_ENABLED}"
      BLOGX_LOGIN_CAPTCHA_ENABLED: "${BLOGX_LOGIN_CAPTCHA_ENABLED}"
      BLOGX_EMAIL_CODE_TIMEOUT_MIN: "${BLOGX_EMAIL_CODE_TIMEOUT_MIN}"
      BLOGX_LOGIN_FAIL_WINDOW_MIN: "${BLOGX_LOGIN_FAIL_WINDOW_MIN}"
      BLOGX_LOGIN_FAIL_USER_MAX: "${BLOGX_LOGIN_FAIL_USER_MAX}"
      BLOGX_LOGIN_FAIL_IP_MAX: "${BLOGX_LOGIN_FAIL_IP_MAX}"
      BLOGX_EMAIL_SEND_WINDOW_SEC: "${BLOGX_EMAIL_SEND_WINDOW_SEC}"
      BLOGX_EMAIL_SEND_PER_EMAIL_MAX: "${BLOGX_EMAIL_SEND_PER_EMAIL_MAX}"
      BLOGX_EMAIL_SEND_PER_IP_MAX: "${BLOGX_EMAIL_SEND_PER_IP_MAX}"
      BLOGX_ARTICLE_SKIP_EXAMINING: "${BLOGX_ARTICLE_SKIP_EXAMINING}"
      BLOGX_COMMENT_SKIP_EXAMINING: "${BLOGX_COMMENT_SKIP_EXAMINING}"
      BLOGX_AI_ENABLED: "${BLOGX_AI_ENABLED}"
      BLOGX_AI_SECRET: "${BLOGX_AI_SECRET}"
      BLOGX_AI_BASE_URL: "${BLOGX_AI_BASE_URL}"
      BLOGX_AI_CHAT_MODEL: "${BLOGX_AI_CHAT_MODEL}"
      BLOGX_AI_REASON_MODEL: "${BLOGX_AI_REASON_MODEL}"
      BLOGX_AI_TIMEOUT_SEC: "${BLOGX_AI_TIMEOUT_SEC}"
      BLOGX_AI_MAX_INPUT_CHARS: "${BLOGX_AI_MAX_INPUT_CHARS}"
      BLOGX_AI_TEMPERATURE: "${BLOGX_AI_TEMPERATURE}"
      BLOGX_AI_DAILY_QUOTA: "${BLOGX_AI_DAILY_QUOTA}"
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      es:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../../backend/config:/app/config:ro
      - ../../state/api/uploads:/app/uploads
      - ../../state/api/logs:/app/logs
      - ../../state/api/var:/app/var
      - ../../docker/api/entrypoint.sh:/app/entrypoint.sh:ro
      - ../../docker/api/es-watch.sh:/app/es-watch.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:$${BLOGX_APP_PORT}/health || exit 1",
        ]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 20s
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    command: ["/app/server", "-f", "config/settings.yaml", "-role=all"]
    networks:
      - blogx_network

  blogx_web:
    container_name: blogx-web
    image: "blogx-web:1"
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: deploy/docker/web/Dockerfile
    environment:
      NODE_ENV: "production"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"
      NUXT_ENV_PROFILE: "${BLOGX_WEB_ENV_PROFILE:-local-local}"
      NUXT_API_UPSTREAM: "${BLOGX_WEB_API_UPSTREAM:-http://blogx_server:8080}"
      NUXT_PUBLIC_ENV_PROFILE: "${BLOGX_WEB_ENV_PROFILE:-local-local}"
      NUXT_PUBLIC_SITE_URL: "${BLOGX_WEB_SITE_URL:-http://localhost}"
      NUXT_PUBLIC_API_BASE: "${BLOGX_WEB_API_BASE:-/api}"
      NUXT_PUBLIC_WS_PATH: "${BLOGX_WEB_WS_PATH:-/api/chat/ws}"
      NUXT_PUBLIC_ASSET_PROXY_BASE: "${BLOGX_WEB_ASSET_PROXY_BASE:-/uploads}"
    depends_on:
      blogx_server:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - blogx_network

  blogx_admin:
    container_name: blogx-admin
    image: "blogx-admin:1"
    restart: unless-stopped
    build:
      context: ../../..
      dockerfile: deploy/docker/admin/Dockerfile
    environment:
      NODE_ENV: "production"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3001"
      NUXT_ENV_PROFILE: "${BLOGX_ADMIN_ENV_PROFILE:-local-local}"
      NUXT_API_UPSTREAM: "${BLOGX_ADMIN_API_UPSTREAM:-http://blogx_server:8080}"
      NUXT_PUBLIC_ENV_PROFILE: "${BLOGX_ADMIN_ENV_PROFILE:-local-local}"
      NUXT_PUBLIC_API_BASE: "${BLOGX_ADMIN_API_BASE:-/api}"
      NUXT_PUBLIC_SITE_URL: "${BLOGX_ADMIN_SITE_URL:-http://localhost/admin}"
      NUXT_PUBLIC_WEB_SITE_URL: "${BLOGX_ADMIN_WEB_SITE_URL:-http://localhost}"
    depends_on:
      blogx_server:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:3001/admin/ || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - blogx_network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    depends_on:
      blogx_server:
        condition: service_healthy
      blogx_web:
        condition: service_healthy
      blogx_admin:
        condition: service_healthy
    environment:
      # 部署形态：local | test | production | api-only（其余变量由 render-config.sh 推导）
      BLOGX_NGINX_ENV: "${BLOGX_NGINX_ENV:-local}"
      # 只有需要覆盖 server_name 时才填（留空则用 profile 的默认值）
      BLOGX_NGINX_SERVER_NAME: "${BLOGX_NGINX_SERVER_NAME:-}"
    volumes:
      - ../../docker/nginx/nginx.conf.tmpl:/etc/nginx/nginx.conf.tmpl:ro
      - ../../docker/nginx/render-config.sh:/etc/nginx/render-config.sh:ro
      - ../../state/nginx/logs:/var/log/nginx/
      - ../../state/nginx/cert:/usr/share/nginx/cert:ro
    # 先 envsubst 渲染模板，再启动 nginx（只用一个 BLOGX_NGINX_ENV 开关）
    command: ["/bin/sh", "/etc/nginx/render-config.sh"]
    networks:
      - blogx_network
    ports:
      - "80:80"
      - "443:443"

networks:
  blogx_network:
    driver: bridge
