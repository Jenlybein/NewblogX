# 站点运行时默认配置。
# 说明：
# 1. 系统启动时会读取此文件，并在数据库还没有运行时配置记录时把这里的值写入数据库。
# 2. 后台「站点」页里的八个 Tab 改的就是这份配置，实际生效值以数据库为准。
# 3. 当数据库中的运行时配置缺失或回退时，这里也会作为默认值来源。
# 4. 这里的值全部是字面量，不再接受环境变量 —— 想让某个功能可用，
#    请去管理员后台填写（第一次进入后台时设置管理员密码）。
#
# 安全默认值：邮件登录、AI、QQ 登录、对象存储默认都是关闭的，
# 因为它们都需要额外的密钥与外部账号，没填就打开只会让用户点出报错。

# 站点展示与登录策略
site:
  site_info:
    # 站点主标题
    title: 技术博客
    # 站点 Logo 图片地址；通常用于页面头部或 SEO 输出
    logo: ""
    # ICP / 公网安备等备案号展示文案
    beian: ""
  project:
    # 前端项目名称；通常用于页面标题、SEO 和管理端展示
    title: 技术博客
    # 前端 favicon 或项目图标地址
    icon: /xxx.png
    # 前端静态入口文件路径；可作为项目主页入口路径配置使用
    web_path: uploads/index.html
  seo:
    # SEO 关键词；多个关键词通常用英文逗号分隔
    keywords: ""
    # SEO 描述摘要
    description: ""
  about:
    # 站点创建/上线日期文案
    site_date: ""
    # 对外展示的 QQ 账号或链接
    qq: ""
    # 对外展示的微信号、二维码链接或说明文案
    wechat: ""
    # Gitee 主页地址
    gitee: ""
    # B 站主页地址
    bilibili: ""
    # GitHub 主页地址
    github: ""
  login:
    # 是否启用 QQ 登录；启用前还需要在「第三方登录」里填好 AppID / AppKey / 回调地址
    qq_login: false
    # 是否启用用户名密码登录
    username_pwd_login: true
    # 是否启用邮箱验证码登录；启用前需要先在「邮件」里配好腾讯云 SES，
    # 否则用户点「获取验证码」会直接报错
    email_login: false
    # 登录和发送邮箱验证码接口是否启用图形验证码中间件
    captcha: false
    # 邮箱验证码有效期，单位：分钟
    email_code_timeout: 5
    # 登录失败统计窗口，单位：分钟
    login_fail_window_minute: 15
    # 单个账号在统计窗口内允许的最大失败次数
    login_fail_user_max: 5
    # 单个 IP 在统计窗口内允许的最大失败次数
    login_fail_ip_max: 20
    # 邮件发送限流窗口，单位：秒
    email_send_window_second: 60
    # 单个邮箱在限流窗口内允许的最大发送次数
    email_send_per_email_max: 1
    # 单个 IP 在限流窗口内允许的最大发送次数
    email_send_per_ip_max: 10
  index_right:
    # 首页右侧组件列表；每项结构为 {title: 组件标题, enable: 是否启用}
    list: []
  article:
    # 是否允许文章发布后直接跳过审核
    skip_examining: true
    # 「发布与展示」三个开关（ADR-0017 决策 2）。
    # 这里只声明意图与默认值；判定落在 internal/article/app 与公开读过滤处
    # （发布/草稿权限见票 #64，非管理员文章的展示过滤见票 #65）。
    # 允许非管理员发布文章：关掉之后普通用户不能"创建即发布"、不能提交审核、
    # 不能发布自己的草稿，也不能更新已发布文章
    allow_non_admin_publish: true
    # 允许非管理员创建草稿：关掉之后普通用户不能新建草稿、不能更新草稿；
    # 存量草稿仍可打开、可删除，但不可保存
    allow_non_admin_draft: true
    # 显示非管理员发布的文章：关掉之后读者端所有公开读面都会过滤掉
    # "作者不是管理员"的文章（详情直链返回 404，收藏夹与浏览历史同样过滤）
    show_non_admin_articles: true
  comment:
    # 是否允许评论发布后直接跳过审核
    skip_examining: true

# 站点 AI 助手配置。
# 默认关闭：模板里的占位 token 会被上游拒绝，开着只会让读者点到报错。
ai:
  # 是否启用 AI 能力。这是总闸：关掉之后即使有启用的模型配置也不可用。
  #
  # 具体用哪家模型不在这里 —— 模型配置是独立的一张表（后台「AI 助手」页的
  # 配置列表），每条包含供应商、密钥、接口地址与模型名，启用其中一条即可。
  enable: false
  # 请求超时时间，单位：秒；<=0 按 60 秒处理
  timeout_sec: 60
  # 单次送入 AI 的最大输入字符数；过长内容会先截断或归一化
  max_input_chars: 100000
  # 采样温度
  temperature: 0.7
  # 每日调用额度，0 表示不限制
  daily_quota: 0
  # 对外展示给用户的 AI 助手简介
  abstract: "你好！我是我的博客的AI助手，可以帮助你找到喜欢的文章！"
  # 对外展示给用户的 AI 助手昵称
  nickname: "博客AI助手"
  # 对外展示给用户的 AI 助手头像地址
  avatar: ""

# 邮件发送（腾讯云 SES）。
# 后台「邮件」页填的就是这一段；默认全空 + 模板 ID 为 0，
# 此时邮箱登录必须保持关闭（见 site.login.email_login）。
mail:
  # 腾讯云 API 密钥（敏感，后台回显时为占位符）
  secret_id: ""
  secret_key: ""
  # 地域：只支持 ap-guangzhou / ap-hongkong
  region: "ap-guangzhou"
  # 国际站账号需要覆盖成 ses.intl.tencentcloudapi.com；留空用默认
  endpoint: ""
  # 发信地址，必须已在控制台验证通过
  from_address: ""
  # 发件人显示名
  from_name: "技术博客"
  # 验证码模板 ID；模板变量为 action / code / timeout
  template_id: 0
  # 单次调用超时（秒）；<=0 按 10 秒处理
  timeout_sec: 10

# 对象存储（七牛云）。
# 这是图片上传的唯一落地方式：关掉之后上传接口直接返回「站点未启用图片上传」，
# 不会退化成存本地。
storage:
  enable: false
  access_key: ""
  secret_key: ""
  bucket: ""
  # 资源访问域名；留空时返回的图片地址不完整
  uri: ""
  # 存储区域标识
  region: "z2"
  # 对象 key 前缀；image-ref 同步靠它从 URL 反解 object key，改了会影响引用关系
  prefix: "myblogx"
  # 单张图片大小上限（MB）
  size: 5
  # 上传凭证有效期（秒）
  expiry: 1800
  # 上传成功后的服务端回调地址；留空表示不启用
  callback_url: ""

# 第三方登录（QQ 互联）。
# 注意：读者站目前没有 QQ 登录入口，这段配好了也不会生效（链路待补）。
oauth:
  app_id: ""
  app_key: ""
  redirect: ""

# 上传策略。
# 只保留白名单：历史字段 size / upload_dir 全仓零读取，已删除。
upload:
  whitelist:
    - bmp
    - jpg
    - jpeg
    - png
    - gif
    - webp

# 装饰配置。
# 只放纯装饰参数：改错了最多难看，不会让任何业务链路坏掉。
# 本票只有光标挂件一个子块；将来加背景、边框这类装饰不用再开新段。
deco:
  charm:
    # 光标挂件总开关。默认开着：上线后读者立刻就能看到，不用先去后台找。
    # 关掉之后读者站不挂载组件、不绑监听、不跑动画帧、不加载站标素材。
    enable: true
    # 站标显示尺寸，单位：px。合法区间 24–96，后台写入时越界会被夹回边界
    logo_size: 48
    # 挂绳长度，单位：px。合法区间 40–240；它同时是"松垂阈值"：
    # 链长比指针到站标的实际距离长，才会有看得见的弧垂（调大重力不会给弧垂）。
    rope_length: 120
    # Verlet 链的节点数，单位：节。合法区间 4–24（整数），越多越顺滑、越费 CPU。
    segments: 10
    # 描边起始宽度，单位：px。合法区间 1–6（保留一位小数）；
    # 收尾宽度固定为起始的 0.6 倍，不进配置（避免参数膨胀）。
    line_width: 2.5
    # 重力加速度，单位：px/s²。合法区间 400–4000；只影响摆动瞬态，不产生弧垂。
    gravity: 1600
    # 每步速度保持系数（无量纲）。合法区间 0.94–0.995，必须小于 1；
    # 越接近 1 越"飘"，越大越不像有重量的绳子，等于或大于 1 会让摆动越甩越大。
    damping: 0.99
    # 静止摆动的频率，单位：Hz。合法区间 0–1.5；0.8Hz 的周期是 1.25s。
    # 0 是合法值：它表示关掉轻晃，读者站退回"静止即零帧"的车道。
    idle_sway_hz: 0.8
    # 静止摆动的加速度幅度，单位：px/s²，作用在自由端。合法区间 0–40。
    # 0 同样是合法值：关掉轻晃（不再有怠速帧）。
    idle_sway_amp: 20
