info:
  contact: {}
  description: BlogX 后端 API 契约（由 swag 从代码注解生成，勿手工编辑产物）。
  title: BlogX API
  version: "1.0"
paths:
  /ai/diagnose:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_ai_api.AIDiagnoseRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 流
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: AI 文本诊断（SSE 流式）
      tags:
      - ai
  /ai/metainfo:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_ai_api.AIBaseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              code:
                type: integer
              data:
                $ref: '#/definitions/myblogx_service_ai_service_ai_metainfo.MetainfoResponse'
              msg:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 生成文章元信息
      tags:
      - ai
  /ai/overwrite:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_ai_api.AIOverwriteRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 流
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: AI 文本改写（SSE 流式）
      tags:
      - ai
  /ai/scoring/article:
    post:
      consumes:
      - application/json
      parameters:
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api_ai_api.AIArticleScoringRequest'
