# 站点运行时默认配置。
# 说明：
# 1. 系统启动时会读取此文件，并在数据库还没有运行时配置记录时把这里的值写入数据库。
# 2. 九段运行时配置改的就是这份默认值，实际生效值以数据库为准；后台八个编辑域
#    （image_gc 暂无编辑页，ADR-0029）保存的是对应段的 payload。
# 3. 当数据库中的运行时配置缺失或回退时，这里也会作为默认值来源。
# 4. 这里的值全部是字面量，不再接受环境变量 —— 想让某个功能可用，
#    请去管理员后台填写（第一次进入后台时设置管理员密码）。
#
# 安全默认值：邮件登录、AI、QQ 登录、对象存储默认都是关闭的，
# 因为它们都需要额外的密钥与外部账号，没填就打开只会让用户点出报错。

# 站点展示与登录策略
site:
  site_info:
    # ICP / 公网安备等备案号展示文案
    # 站点标题与 Logo 不再可配置（#192）：品牌由读者站的代码常量提供，
    # favicon 走下面 project.icon。
    beian: ""
  project:
    # 前端项目名称；通常用于页面标题、SEO 和管理端展示
    title: 技术博客
    # 前端 favicon 或项目图标地址
    icon: /xxx.png
    # 前端静态入口文件路径；可作为项目主页入口路径配置使用
    web_path: uploads/index.html
  seo:
    # SEO 关键词；多个关键词通常用英文逗号分隔
    keywords: ""
    # SEO 描述摘要
    description: ""
  about:
    # 站点创建/上线日期文案
    site_date: ""
    # 对外展示的 QQ 账号或链接
    qq: ""
    # 对外展示的微信号、二维码链接或说明文案
    wechat: ""
    # Gitee 主页地址
    gitee: ""
    # B 站主页地址
    bilibili: ""
    # GitHub 主页地址
    github: ""
  login:
    # 是否启用 QQ 登录；启用前还需要在「第三方登录」里填好 AppID / AppKey / 回调地址
    qq_login: false
    # 是否启用用户名密码登录
    username_pwd_login: true
    # 是否启用邮箱验证码登录；启用前需要先在「邮件」里配好腾讯云 SES，
    # 否则用户点「获取验证码」会直接报错
    email_login: false
    # 登录和发送邮箱验证码接口是否启用图形验证码中间件
    captcha: false
    # 邮箱验证码有效期，单位：分钟
    email_code_timeout: 5
    # 登录失败统计窗口，单位：分钟
    login_fail_window_minute: 15
    # 单个账号在统计窗口内允许的最大失败次数
    login_fail_user_max: 5
    # 单个 IP 在统计窗口内允许的最大失败次数
    login_fail_ip_max: 20
    # 邮件发送限流窗口，单位：秒
    email_send_window_second: 60
    # 单个邮箱在限流窗口内允许的最大发送次数
    email_send_per_email_max: 1
    # 单个 IP 在限流窗口内允许的最大发送次数
    email_send_per_ip_max: 10
  article:
    # 是否允许文章发布后直接跳过审核
    skip_examining: true
    # 「发布与展示」三个开关（ADR-0017 决策 2）。
    # 这里只声明意图与默认值；判定落在 internal/article/app 与公开读过滤处
    # （发布/草稿权限见票 #64，非管理员文章的展示过滤见票 #65）。
    # 允许非管理员发布文章：关掉之后普通用户不能"创建即发布"、不能提交审核、
    # 不能发布自己的草稿，也不能更新已发布文章
    allow_non_admin_publish: true
    # 允许非管理员创建草稿：关掉之后普通用户不能新建草稿、不能更新草稿；
    # 存量草稿仍可打开、可删除，但不可保存
    allow_non_admin_draft: true
    # 显示非管理员发布的文章：关掉之后读者端所有公开读面都会过滤掉
    # "作者不是管理员"的文章（详情直链返回 404，收藏夹与浏览历史同样过滤）
    show_non_admin_articles: true
    # 投稿配额：每个普通用户每自然日可提交多少次（ADR-0030）。
    # 计量单位是**提交动作**：被打回也计一次（每次提交都真的产生一条审核任务），
    # 因系统不可用而失败的提交不占额度（预占后释放）。管理员不受此上限约束。
    # 越界 / 0 / 负数在生效值模块里回落到默认值 15，按字面执行会让全站当天
    # 一篇文章都提交不了。后台「站点 → 文章」可改，保存后下一次请求即生效。
    submit_daily_max: 15
    # 发布质量闸门（票 306 / ADR-0032）。
    #
    # 默认关闭：零值 = 关闭，提交路径与引入闸门之前完全一致。开启这个动作本身
    # 会先校验 AI 可用（总闸关闭或没有启用的模型时，后台保存直接失败）。
    #
    # 实际放行线 = pass_score + gray_band_width（灰带做在及格线**上方**）。
    quality_gate:
      enabled: false
      pass_score: 50
      gray_band_width: 2
      band_poor_max: 30
      band_unqualified_max: 59
      band_normal_max: 80
      band_good_max: 89
    # 机审前两层的高危词表（票 311 / spec #302 决策 22、27）。
    # 词表是**运行期数据**：运营在后台热改，改完下一次读取立即按新词表判，
    # 不发版、不回填历史（两层都是纯函数，结论不落库）。
    # 两档的分工：「阻断级」将来可自动拒（本票只标红），清单要小而准；
    # 「观察级」只标红，把处置权交给审核员。
    # 两侧的判定规则（大小写、拉丁词边界、CJK 子串、评分派生阈值）在
    # internal/article/domain/moderation 里，是代码；这里只放"判哪些词"。
    moderation:
      # 阻断级：命中即高风险。默认取几条明确指向违法交易/诈骗的短语，
      # 不取"赌博""色情"这类宽词（它们会命中合法的科普与讨论）。
      block_words:
        - 代开发票
        - 办假证
        - 出售账号
        - 博彩网站
      # 观察级：命中只标红，常见于推广话术，误报代价低。
      watch_words:
        - 加微信
        - 私聊
        - 代写
        - 刷单
  comment:
    # 是否允许评论发布后直接跳过审核
    skip_examining: true
  chat:
    # 是否允许陌生人发私信（站点级策略，#202）。
    # 必须**显式**写 false：陌生人私信默认关闭，且这个"关"不能靠
    # "配置里没有这个键"隐式得到 —— 缺键同样解析成 false，一旦有人改
    # 默认值或删掉这一行，语义会静默翻转。后台在「站点 → 私信」卡里改。
    stranger_msg_enabled: false
    # 发送限流（ADR-0026）：同一发件人对同一收件人，窗口内允许 1 条、
    # 自然日内允许 rate_daily_max 条。后台「站点 → 私信」可改，保存后立即生效。
    # 两项都必须显式写：缺省值不能靠"配置缺键"隐式得到。
    rate_window_sec: 10
    rate_daily_max: 99
  reconcile:
    # 并账周期（分钟，#279）：文章计数与私信未读共用同一个定时任务，
    # 周期从这里读，代码里不再有第二份默认值。
    # 缺省 / 负数回落到 30 分钟，上限钳到一天；改小到秒级只会放大写放大。
    interval_minutes: 30

# 站点 AI 助手配置。
# 默认关闭：模板里的占位 token 会被上游拒绝，开着只会让读者点到报错。
ai:
  # 是否启用 AI 能力。这是总闸：关掉之后即使有启用的模型配置也不可用。
  #
  # 具体用哪家模型不在这里 —— 模型配置是独立的一张表（后台「AI 助手」页的
  # 配置列表），每条包含供应商、密钥、接口地址与模型名，启用其中一条即可。
  enable: false
  # 请求超时时间，单位：秒；<=0 按 60 秒处理
  timeout_sec: 60
  # 单次送入 AI 的最大输入字符数；过长内容会先截断或归一化
  max_input_chars: 100000
  # 采样温度
  temperature: 0.7
  # 七个 AI 场景的「每人每自然日」调用上限（ADR-0038）。
  #
  # 0 表示不限制；负数与超过 9999 的值在保存时被拒绝。
  # 计量口径：一次出站模型调用算一次；评分例外——一次评分动作只算一次
  # （长文按段落分块，内部多次调用不重复扣）。
  # 后台在「AI 助手」页改，保存后下一次请求即生效。
  daily_limits:
    # 投稿质量评分（闸门同步评分 + 作者主动重评）。按动作计，20 约等于 20 次评分动作。
    scoring: 20
    # 写作页根据正文生成标题 / 摘要 / 分类 / 标签。
    metainfo: 50
    # 写作页选区改写（流式）。
    overwrite: 50
    # 写作页选区诊断。
    diagnose: 20
    # AI 搜索第一步：把问题改写成检索意图。
    search_rewrite: 50
    # AI 搜索第二步：基于检索结果作答（一次问答会各消耗改写与作答各一次）。
    search_answer: 50
    # 投稿合规判定（异步）。挂在作者头上，所以额度恢复后文章会自动重审。
    moderation: 20
  # 对外展示给用户的 AI 助手简介
  abstract: "你好！我是我的博客的AI助手，可以帮助你找到喜欢的文章！"
  # 对外展示给用户的 AI 助手昵称
  nickname: "博客AI助手"
  # 对外展示给用户的 AI 助手头像地址
  avatar: ""
  # 「哪个 AI 场景用哪份运行时策略 skill」的产品接线（#310）。
  #
  # 这是运行期配置，不是 skill 文件的一部分：skill 必须可移植，场景绑定要能
  # 临时摘掉某份 skill 而不发版。key 是 AI 调用场景（见 internal/ai 的 Scene* 常量），
  # value 是仓库根 skills/<name>/SKILL.md 的名称（按顺序拼接正文）。
  # 引用了不存在的 skill 时，该场景的 AI 调用明确失败，不会静默用一份空口径。
  scene_skills:
    search_answer:
      - jelly-voice
    # 投稿合规判定（票 312 / ADR-0033）绑定 skills/moderation。
    # 绑定的是"这个站点在意什么"（判定口径与注意事项），不是驳回话术库：
    # 驳回理由用固定枚举，不占 skill。
    moderation:
      - moderation
    # 文章质量评分（票 306 / ADR-0032，口径见 ADR-0040）绑定 skills/scoring。
    # 绑定的是「什么算值得发布」的判定口径：木桶、形态下限、维度判据。
    # 分档数字与 JSON 形状仍在代码里——那是解析契约，不能让文案改坏。
    scoring:
      - scoring

# 邮件发送（腾讯云 SES）。
# 后台「邮件」页填的就是这一段；默认全空 + 模板 ID 为 0，
# 此时邮箱登录必须保持关闭（见 site.login.email_login）。
mail:
  # 腾讯云 API 密钥（敏感，后台回显时为占位符）
  secret_id: ""
  secret_key: ""
  # 地域：只支持 ap-guangzhou / ap-hongkong
  region: "ap-guangzhou"
  # 国际站账号需要覆盖成 ses.intl.tencentcloudapi.com；留空用默认
  endpoint: ""
  # 发信地址，必须已在控制台验证通过
  from_address: ""
  # 发件人显示名
  from_name: "技术博客"
  # 验证码模板 ID；模板变量为 action / code / timeout
  template_id: 0
  # 单次调用超时（秒）；<=0 按 10 秒处理
  timeout_sec: 10

# 对象存储（七牛云）。
# 这是图片上传的唯一落地方式：关掉之后上传接口直接返回「站点未启用图片上传」，
# 不会退化成存本地。
storage:
  enable: false
  access_key: ""
  secret_key: ""
  bucket: ""
  # 资源访问域名；留空时返回的图片地址不完整
  uri: ""
  # 存储区域标识
  region: "z2"
  # 对象 key 前缀；image-ref 同步靠它从 URL 反解 object key，改了会影响引用关系
  prefix: "myblogx"
  # 单张图片大小上限（MB）
  size: 5
  # 上传凭证有效期（秒）
  expiry: 1800
  # 上传成功后的服务端回调地址；留空表示不启用
  callback_url: ""

# 第三方登录（QQ 互联）。
# 注意：读者站目前没有 QQ 登录入口，这段配好了也不会生效（链路待补）。
oauth:
  app_id: ""
  app_key: ""
  redirect: ""

# 上传策略。
# 只保留白名单：历史字段 size / upload_dir 全仓零读取，已删除。
upload:
  whitelist:
    - bmp
    - jpg
    - jpeg
    - png
    - gif
    - webp

# 孤儿图回收的运行配置（issue #139 只读清单 / issue #140 真删）。
# 清单（`-t imagegc`）只读，始终可用；enabled 只控制真删（带 -apply）。
# 这里的值只在数据库没有对应段时生效，实际以库里那份为准。
image_gc:
  # 真删总开关。默认关闭：删除不可逆，异常时可改这一行立刻停手（不必重启）。
  enabled: false
  # 冷静期（天）：上传不足这么多天的图不进入候选。
  # 14 天覆盖"本周传图、下周才发文"的更新节奏与 CDC 积压余量。
  grace_days: 14
  # 单次最多检查（或真删）的图片条数（硬上限 500，超过按 500 夹回）。
  batch_limit: 50

# Generated from config/deco-charm-parameters.json by scripts/generate-deco-parameters.mjs; DO NOT EDIT.
# 装饰配置只放纯装饰参数：改错了最多难看，不会让任何业务链路坏掉。
deco:
  charm:
    # 光标挂件总开关。默认开着：上线后读者立刻就能看到，不用先去后台找。
    enable: true
    # 站标显示尺寸，单位：px。合法区间 15–70，后台写入时越界会被夹回边界。
    logo_size: 48
    # 挂绳长度，单位：px。合法区间 40–240；它同时是松垂阈值，链长比指针到站标的实际距离长，才会有看得见的弧垂（调大重力不会给弧垂）。
    rope_length: 120
    # Verlet 链的节点数，单位：节。合法区间 4–30（整数），越多越顺滑、越费 CPU。
    segments: 10
    # 描边起始宽度，单位：px。合法区间 1–6（保留一位小数）；收尾宽度固定为起始的 0.6 倍，不进配置（避免参数膨胀）。
    line_width: 2.5
    # 重力加速度，单位：px/s²。合法区间 400–4000；只影响摆动瞬态，不产生弧垂。
    gravity: 1600
    # 每步速度保持系数（无量纲）。合法区间 0.9–1；1 表示速度完全不衰减，摆动可能持续振荡，大于 1 才会越甩越大，越界值仍会被夹回 1。
    damping: 0.99
    # 距离约束刚度（无量纲）。合法区间 0.2–1；1 = 每次迭代全量投影（刚杆手感），越小越弹：拖动时绳子先被拉长，松手后回弹。默认 0.5。
    stiffness: 0.5
    # 静止摆动的频率，单位：Hz。合法区间 0–1.5；0.8Hz 的周期是 1.25s。0 是合法值：它表示关掉轻晃，读者站在链收敛后停帧（不再有逐帧成本）。
    idle_sway_hz: 0.8
    # 静止摆动的加速度幅度，单位：px/s²，作用在自由端。合法区间 0–40。0 同样是合法值：关掉轻晃（链收敛后停帧，不再有持续重绘）。
    idle_sway_amp: 20
    # 最高渲染帧率，单位：fps（整数）。合法区间 30–160，越界与非法值静默钳到边界。它是每秒画几次的上限，不影响绳子运动速度（物理按真实时间推进）；高于显示器刷新率时等价于每帧（160 档在 60Hz 屏上就等于不限）。下限 30 由物理截断决定：一帧 33.3ms 对 0.05s 的累加器上限仍有余量。
    fps_cap: 60
    # 指针端偏移的水平分量，单位：px。合法区间 -24–24（整数），允许负值（负值让指针端挂在光标左侧）。指针端节点 = 指针热点 + (X, Y)：默认的 (3, 3) 让指针端从光标右下角悬挂，快速拖行时不再像绳子从指尖中间长出来。0 是合法值（指针端正好压在热点上），不回落默认。
    pointer_offset_x: 3
    # 指针端偏移的垂直分量，单位：px。合法区间 -24–24（整数），负值往上偏。两轴到 ±24 时指针端与光标会明显脱节（像断线），这是有意的上界。
    pointer_offset_y: 3
# <!-- END GENERATED DECO -->