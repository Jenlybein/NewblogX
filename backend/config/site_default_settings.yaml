# 站点运行时默认配置。
# 说明：
# 1. 系统启动时会读取此文件，并在数据库还没有运行时配置记录时把这里的值写入数据库。
# 2. 十二段运行时配置改的就是这份默认值，实际生效值以数据库为准；后台十一个编辑域
#    （image_gc 暂无编辑页，ADR-0020）保存的是对应段的 payload。
# 3. 当数据库中的运行时配置缺失或回退时，这里也会作为默认值来源。
# 4. 这里的值全部是字面量，不再接受环境变量 —— 想让某个功能可用，
#    请去管理员后台填写（第一次进入后台时设置管理员密码）。
#
# 安全默认值：邮件登录、AI、QQ 登录、对象存储默认都是关闭的，
# 因为它们都需要额外的密钥与外部账号，没填就打开只会让用户点出报错。

# 站点展示与登录策略
site:
  site_info:
    # ICP / 公网安备等备案号展示文案
    # 站点标题与 Logo 不再可配置（#192）：品牌由读者站的代码常量提供，
    # favicon 走下面 project.icon。
    beian: ""
  project:
    # 前端项目名称；通常用于页面标题、SEO 和管理端展示
    title: 技术博客
    # 前端 favicon 或项目图标地址
    icon: /xxx.png
    # 前端静态入口文件路径；可作为项目主页入口路径配置使用
    web_path: uploads/index.html
  seo:
    # SEO 关键词；多个关键词通常用英文逗号分隔
    keywords: ""
    # SEO 描述摘要
    description: ""
  about:
    # 站点创建/上线日期文案
    site_date: ""
    # 对外展示的 QQ 账号或链接
    qq: ""
    # 对外展示的微信号、二维码链接或说明文案
    wechat: ""
    # Gitee 主页地址
    gitee: ""
    # B 站主页地址
    bilibili: ""
    # GitHub 主页地址
    github: ""
  login:
    # 是否启用用户名密码登录
    username_pwd_login: true
    # 登录失败统计窗口，单位：分钟
    login_fail_window_minute: 15
    # 单个账号在统计窗口内允许的最大失败次数
    login_fail_user_max: 5
    # 单个 IP 在统计窗口内允许的最大失败次数
    login_fail_ip_max: 20
    #
    # 这里曾经还放着邮箱/短信/QQ 登录开关、验证码有效期、发码限流与四个验证码闸门
    # （票 票 481 拆走）。现在它们跟着各自的通道段走：mail / sms / oauth / captcha。
    # 留在 site.login 的这四项描述的是"登录尝试"本身，与走哪条通道无关。
  article:
    # 是否允许文章发布后直接跳过审核
    skip_examining: true
    # 「发布与展示」三个开关（ADR-0015 决策 2）。
    # 这里只声明意图与默认值；判定落在 internal/article/app 与公开读过滤处
    # （发布/草稿权限见票 #64，非管理员文章的展示过滤见票 #65）。
    # 允许非管理员发布文章：关掉之后普通用户不能"创建即发布"、不能提交审核、
    # 不能发布自己的草稿，也不能更新已发布文章
    allow_non_admin_publish: true
    # 允许非管理员创建草稿：关掉之后普通用户不能新建草稿、不能更新草稿；
    # 存量草稿仍可打开、可删除，但不可保存
    allow_non_admin_draft: true
    # 显示非管理员发布的文章：关掉之后读者端所有公开读面都会过滤掉
    # "作者不是管理员"的文章（详情直链返回 404，收藏夹与浏览历史同样过滤）
    show_non_admin_articles: true
    # 投稿配额：每个普通用户每自然日可提交多少次（ADR-0021）。
    # 计量单位是**提交动作**：被打回也计一次（每次提交都真的产生一条审核任务），
    # 因系统不可用而失败的提交不占额度（预占后释放）。管理员不受此上限约束。
    # 越界 / 0 / 负数在生效值模块里回落到默认值 15，按字面执行会让全站当天
    # 一篇文章都提交不了。后台「站点 → 文章」可改，保存后下一次请求即生效。
    submit_daily_max: 15
    # 一篇文章最多可选的标签数（默认 5，后台可改）。
    #
    # 标签越多越没有指向性（一篇文章挂二十个标签等于"它什么都算"），所以这里有上限；
    # 默认 5 覆盖"语言 + 框架 + 领域 + 类型 + 场景"这种典型组合仍有余量。
    #
    # 0 / 负数 / 超过 20 按默认值 5 处理（见 domain.NormalizeTagLimit）：
    # 把这一项填成 0 不该让全站都存不了草稿。
    max_tags_per_article: 5
    # 发布质量闸门（票 306 / ADR-0023）。
    #
    # 默认关闭：零值 = 关闭，提交路径与引入闸门之前完全一致。开启这个动作本身
    # 会先校验 AI 可用（总闸关闭或没有启用的模型时，后台保存直接失败）。
    #
    # 它与「文章质量评分」是父子关系（2026-11-28 / ADR-0037）：评分关掉时归一化
    # 会强制把这一项写成 false，所以不存在"评分关了闸门还开着"的矛盾值。
    # 默认值不变 —— 父子关系是保存侧规则，不改变"新装站点默认不开闸门"。
    #
    # 实际放行线 = pass_score + gray_band_width（灰带做在及格线**上方**）。
    quality_gate:
      enabled: false
      pass_score: 50
      gray_band_width: 2
      band_poor_max: 30
      band_unqualified_max: 59
      band_normal_max: 80
      band_good_max: 89
    # 「文章质量评分」总开关（默认 true）。
    #
    # 关掉后：三条产生路径（提交时同步评分 / 后台重评 / 发布判定补算）全停，
    # 读者站与写稿页不再显示任何分数，评分接口统一返回 article.score_disabled。
    # 它是闸门的父开关 —— 归一化会强制把 quality_gate.enabled 写成 false。
    # 必须**显式**写 true：缺键解析成 false，会让新装站点莫名没有评分。
    score_enabled: true
    # 「AI 合规判定」（第③层）开关（默认 true）。
    #
    # 关掉后：文章不再走模型判定，质量已过即可见。与「文章免审核」最终走
    # 同一条"没有机器判据 ⇒ 提交即可见"分支，区别是免审核是临时放行、
    # 这是常态配置。必须显式写 true。
    ai_compliance_enabled: true
    # AI 合规判定不可用 / 失败时文章落到哪里（默认 manual）。
    #
    # manual（转人工）| hold（保持待可见，次日重投）| draft（退回草稿）|
    # release（直接放行，落「未判定」并记警告日志）。
    # 只支配"这次调用失败"：模型判 suspect / 低风险 violation 是结论不是失败，
    # 仍转人工；额度用完固定 hold，同样不看这个值。
    ai_failure_action: manual
  chat:
    # 是否允许陌生人发私信（站点级策略，#202）。
    # 必须**显式**写 false：陌生人私信默认关闭，且这个"关"不能靠
    # "配置里没有这个键"隐式得到 —— 缺键同样解析成 false，一旦有人改
    # 默认值或删掉这一行，语义会静默翻转。后台在「站点 → 私信」卡里改。
    stranger_msg_enabled: false
    # 发送限流（ADR-0018）：同一发件人对同一收件人，窗口内允许 1 条、
    # 自然日内允许 rate_daily_max 条。后台「站点 → 私信」可改，保存后立即生效。
    # 两项都必须显式写：缺省值不能靠"配置缺键"隐式得到。
    rate_window_sec: 10
    rate_daily_max: 99
  reconcile:
    # 并账周期（分钟，#279）：文章计数与私信未读共用同一个定时任务，
    # 周期从这里读，代码里不再有第二份默认值。
    # 缺省 / 负数回落到 30 分钟，上限钳到一天；改小到秒级只会放大写放大。
    interval_minutes: 30

# 站点 AI 助手配置。
# 默认关闭：模板里的占位 token 会被上游拒绝，开着只会让读者点到报错。
ai:
  # 是否启用 AI 能力。这是总闸：关掉之后即使有启用的模型配置也不可用。
  #
  # 2026-11-28 语义澄清：它只管"服务端能不能调模型"（评分 / 合规判定 / 摘要 /
  # 搜索向量 / 图片审核），**不再**表示右下角浮窗。UI 也从「AI 助手」页迁到
  # 「站点」页 —— 它管全站能力，放在某个功能的设置页里会让人误会。
  #
  # 具体用哪家模型不在这里 —— 模型配置是独立的一张表（后台「AI 助手」页的
  # 配置列表），每条包含供应商、密钥、接口地址与模型名，启用其中一条即可。
  enable: false
  # 读者站右下角的 AI 助手浮窗是否显示（默认 true，与总闸解耦）。
  # 关掉它不影响任何后端 AI 能力：评分、合规判定照旧跑。
  assistant_enabled: true
  # 请求超时时间，单位：秒；<=0 按 60 秒处理
  timeout_sec: 60
  # 单次送入 AI 的最大输入字符数；过长内容会先截断或归一化
  max_input_chars: 100000
  # 采样温度
  temperature: 0.7
  # 七个 AI 场景的「每人每自然日」调用上限（ADR-0028）。
  #
  # 0 表示不限制；负数与超过 9999 的值在保存时被拒绝。
  # 计量口径：一次出站模型调用算一次；评分例外——一次评分动作只算一次
  # （长文按段落分块，内部多次调用不重复扣）。
  # 后台在「AI 助手」页改，保存后下一次请求即生效。
  daily_limits:
    # 投稿质量评分（闸门同步评分 + 作者主动重评）。按动作计，20 约等于 20 次评分动作。
    scoring: 20
    # 写作页根据正文生成标题 / 摘要 / 分类 / 标签。
    metainfo: 50
    # 写作页选区改写（流式）。
    overwrite: 50
    # 写作页选区诊断。
    diagnose: 20
    # AI 搜索第一步：把问题改写成检索意图。
    search_rewrite: 50
    # AI 搜索第二步：基于检索结果作答（一次问答会各消耗改写与作答各一次）。
    search_answer: 50
    # 投稿合规判定（异步）。挂在作者头上，所以额度恢复后文章会自动重审。
    moderation: 20
  # 对外展示给用户的 AI 助手简介
  abstract: "你好！我是我的博客的AI助手，可以帮助你找到喜欢的文章！"
  # 对外展示给用户的 AI 助手昵称
  nickname: "博客AI助手"
  # 对外展示给用户的 AI 助手头像地址
  avatar: ""
  # 「哪个 AI 场景用哪份运行时策略 skill」的产品接线（#310）。
  #
  # 这是运行期配置，不是 skill 文件的一部分：skill 必须可移植，场景绑定要能
  # 临时摘掉某份 skill 而不发版。key 是 AI 调用场景（见 internal/ai 的 Scene* 常量），
  # value 是仓库根 skills/<name>/SKILL.md 的名称（按顺序拼接正文）。
  # 引用了不存在的 skill 时，该场景的 AI 调用明确失败，不会静默用一份空口径。
  scene_skills:
    search_answer:
      - jelly-voice
    # 投稿合规判定（票 312 / ADR-0024）绑定 skills/moderation。
    # 绑定的是"这个站点在意什么"（判定口径与注意事项），不是驳回话术库：
    # 驳回理由用固定枚举，不占 skill。
    moderation:
      - moderation
    # 文章质量评分（票 306 / ADR-0023，口径见 ADR-0023）绑定 skills/scoring。
    # 绑定的是「什么算值得发布」的判定口径：木桶、形态下限、维度判据。
    # 分档数字与 JSON 形状仍在代码里——那是解析契约，不能让文案改坏。
    scoring:
      - scoring

# 邮件通道（腾讯云 SES）。
# 后台「邮件」页填的就是这一段；默认凭据全空 + 模板 ID 为 0，
# 此时邮箱登录必须保持关闭（见本段的 email_login）。
#
# 这一段同时是「邮箱验证码通道」的唯一事实源（票 票 481）：开关、验证码有效期、
# 发码限流都在这里，不再散落在 site.login。
mail:
  # 腾讯云 API 密钥（敏感，后台回显时为占位符）
  secret_id: ""
  secret_key: ""
  # 地域：只支持 ap-guangzhou / ap-hongkong
  region: "ap-guangzhou"
  # 国际站账号需要覆盖成 ses.intl.tencentcloudapi.com；留空用默认
  endpoint: ""
  # 发信地址，必须已在控制台验证通过
  from_address: ""
  # 发件人显示名
  from_name: "技术博客"
  # 验证码模板 ID；模板变量为 action / code / timeout
  template_id: 0
  # 单次调用超时（秒）；<=0 按 10 秒处理
  timeout_sec: 10
  # 是否启用邮箱验证码登录；启用前需要先配好上面的腾讯云 SES，
  # 否则用户点「获取验证码」会直接报错
  email_login: false
  # 是否启用邮箱注册。
  # 与 email_login 分开：绑定邮箱要用发码接口，混成一个开关会连带把
  # 「给已注册用户发绑定验证码」一起关掉。本站点默认注册只走手机号。
  email_register: false
  # 邮箱验证码有效期，单位：分钟
  email_code_timeout: 5
  # 邮件发送限流窗口，单位：秒
  email_send_window_second: 60
  # 单个邮箱在限流窗口内允许的最大发送次数
  email_send_per_email_max: 1
  # 单个 IP 在限流窗口内允许的最大发送次数
  email_send_per_ip_max: 10

# 对象存储（七牛云）。
# 这是图片上传的唯一落地方式：关掉之后上传接口直接返回「站点未启用图片上传」，
# 不会退化成存本地。
storage:
  enable: false
  access_key: ""
  secret_key: ""
  bucket: ""
  # 资源访问域名；留空时返回的图片地址不完整
  uri: ""
  # 存储区域标识
  region: "z2"
  # 对象 key 前缀；image-ref 同步靠它从 URL 反解 object key，改了会影响引用关系
  prefix: "myblogx"
  # 单张图片大小上限（MB）
  size: 5
  # 上传凭证有效期（秒）
  expiry: 1800
  # 上传成功后的服务端回调地址；留空表示不启用
  callback_url: ""
  # 可上传的文件后缀（门禁口径：确认上传时再按探测到的真实格式校验一次）。
  # 从「上传策略」段并入（票 410）：对象存储是"能不能传/传多大/什么格式"的唯一事实源。
  whitelist:
    - bmp
    - jpg
    - jpeg
    - png
    - gif
    - webp
  # —— 图片展示样式（ADR-0034）——
  # 四档样式名必须与七牛控制台里已创建的样式**名字完全一致**；留空表示该档用原图。
  # 样式是读取时派生的：库里只存原图地址，改这里或清这里都立刻生效，不用回填数据。
  # 填错样式名不会回退到原图，而是 404 —— 保存后请用后台的「探活检测」按一次。
  image_style_cover: ""
  image_style_avatar: ""
  image_style_content: ""
  image_style_chat: ""
  # 样式分隔符，必须与七牛控制台「多媒体样式 → 访问设置」里的一致（默认 "-"）
  style_delimiter: "-"
  # 私有空间：为真时所有图片地址都带下载凭证
  private_read: false
  # 下载签名有效期（秒）。不要与上传凭证的 expiry 混用：那个只有几十秒
  download_expiry: 3600
  # —— 图片内容审核（ADR-0034）——
  # 审核总开关；关掉等于"不审"，图恢复上传即通过的老行为
  audit_enabled: true
  # 等不到审核结论的容忍时长（秒），超过转人工队列；绝不因超时放行
  audit_timeout_seconds: 60
  # 判定违规的图立刻删除对象存储文件，且同哈希永久拒收（终局）
  audit_auto_delete_block: true
  # 展示闸门：关掉等于"未过审也可展示"，留作审核链路故障时的紧急放行
  audit_gate_enabled: true

# 第三方登录（QQ 互联）。
# 注意：读者站目前没有 QQ 登录入口，这段配好了也不会生效（链路待补）。
oauth:
  app_id: ""
  app_key: ""
  redirect: ""
  # 是否启用 QQ 登录（票 票 481 从 site.login 迁入）；
  # 启用前还需要填好上面三项
  qq_login: false

# 短信通道（阿里云号码认证服务 PNVS 的「短信认证」）。
#
# 这里放两件事：怎么把短信发出去（密钥、接入点、签名、模板、超时），
# 以及这条通道允不允许用、验证码多久过期、发码限流多严（票 票 481 从 site.login 迁入）。
#
# 单独一段而不是塞进 site 段：site 段有匿名可读的公开端点
# （GET /site/site 直接返回整个 site 段），密钥放进去等于公开。
# ADR-0020 的段清单因此又增加一段（现在共十二段，见文件末尾说明）。
sms:
  # 阿里云 AccessKey ID
  access_key_id: ""
  # 阿里云 AccessKey Secret；后台回显时遮蔽，落库前加密
  access_key_secret: ""
  # 接入点，留空按 dypnsapi.aliyuncs.com
  endpoint: ""
  # 短信签名；PNVS 短信认证需使用控制台赠送的签名，并与赠送模板配套
  sign_name: ""
  # 短信模板 Code；模板含「验证码」与「有效期」两个变量
  template_code: ""
  # 单次发码调用的超时秒数；<=0 按 10
  timeout_sec: 10
  # 是否启用手机号 + 短信验证码登录（首次登录即注册）
  phone_login: false
  # 短信验证码有效期，单位：分钟；由阿里云按 ValidTime 执行
  sms_code_timeout: 5
  # 短信发送限流窗口，单位：秒（与邮件分开计数：短信成本更高、滥用方式不同）
  sms_send_window_second: 60
