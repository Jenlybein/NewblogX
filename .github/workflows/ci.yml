name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"

jobs:
  # ── 是否需要跑 CI ────────────────────────────────────────────────
  # 合并后 main 上的那次 CI 是**重复劳动**：squash merge 生成的提交树与 PR head
  # 完全一致，而 PR 上已经跑过同一套检查（分支保护要求 15 项全绿才允许合并）。
  # 再跑一遍只是让每次合并多等 5 分钟，且不会发现任何新问题。
  #
  # 判据：push 事件的提交标题以 `(#数字)` 结尾 —— 这正是 squash merge 的命名约定，
  # 由 GitHub 自动生成。直接 push 的提交不会长这样，仍然会跑全量 CI。
  # 需要强制全量跑时用 workflow_dispatch。
  #
  # 提交标题通过 env 传入，不拼进脚本正文：标题来自外部输入，拼进去等于把
  # 任意字符串注入 shell。
  precheck:
    name: precheck（是否需要跑 CI）
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "非 push 事件（${GITHUB_EVENT_NAME}），跑全量 CI"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          title=$(printf '%s' "$COMMIT_TITLE" | head -n 1)
          if printf '%s' "$title" | grep -qE '\(#[0-9]+\)$'; then
            echo "squash merge 提交（$title），PR 上已跑过同一套检查，跳过"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "非 squash merge 提交（$title），跑全量 CI"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # ── 后端：编译 + vet + 单测（race）────────────────────────────────
  backend:
    name: backend (build / vet / test)
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      # setup-go 只缓存**模块**（下载过的依赖），不缓存**编译产物**。
      # 没有这一层，`go build ./...` 每次都要全量重编（实测 146s）——
      # 而同样的构建在有缓存时是 20s 级。cache key 带 run_id 是为了每轮都存一份
      # 新的（代码一直在变），restore-keys 负责命中最近一份。
      - name: Go 构建缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            gobuild-${{ runner.os }}-

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # 测试不在这里跑：项目里没有任何测试使用 testing.Short()，
      # 所以 "-race -short" 与下面 integration job 的 "-tags integration"
      # 跑的是同一批用例（后者是超集）。重复跑一遍只是多花 3 分钟。
      # 全部测试集中在 backend-integration job（带 -race）。

  # ── 集成测试：golden / 真实 SQL / 容器契约 ──────────────────────────
  # 这些测试打了 //go:build integration，-short 跑不到。
  # 它们覆盖的是"编译期看不出来"的错误：row 结构漏列、内嵌结构不导出导致
  # 主键静默为零、outbox 中继租约恢复、日志管道落盘。之前一直没有 CI job，
  # 等于这些保护只在开发机手动跑过。
  #
  # 用一个 MySQL service 供所有测试包共用：testkit 的 sync.Once 是包级的、
  # 每个包是独立进程，不共用的话 12 个包各起一个容器，并行时互相拖垮。
  backend-integration:
    name: backend (integration ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    # 分片：整包 `go test ./...` 带 -race 要 6 分钟，是整条流水线最慢的一段。
    # 按包名排序后轮流分配，三片并行跑，墙钟时间降到 ~2 分钟。
    # fail-fast 关掉：一片红了也要看完另外两片的结果，否则修一处再等一轮。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
      # 真实索引供「软删 → 发件箱中继 → 索引文档消失」的组合用例使用。
      # 用 service 而不是让测试自己起容器：镜像拉取由 job 统一负责，起不来就是
      # job 失败，不会被 escontainer 的 t.Skipf 静默跳过（那正是本仓反对的"假绿"）。
      # 测试侧优先读 BLOGX_ES_ADDR，见 internal/testkit/escontainer。
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Go 构建缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            gobuild-${{ runner.os }}-

      # ClickHouse 那批仍用 testcontainers，需要 Docker：runner 自带，这里断言一下，
      # 免得哪天镜像变了变成静默跳过。
      - name: 确认 Docker 可用（ClickHouse 容器测试的依赖）
        run: docker info

      # 一次跑全部测试：-tags integration 已包含所有非 integration 用例，
      # -race 保留（本地可用 BLOGX_FAST=1 跳过，CI 不应该跳过）。
      #
      # -count=1 等价于 BLOGX_NO_CACHE=1：强制真跑，不复用测试结果缓存。
      # CI 本来就没有历史缓存，但显式写出来，避免有人以为"绿了"是缓存给的。
      #
      # 分片：按 `go list ./...` 的排序结果轮流取，第 N 片取 i % 3 == N-1。
      # 不用 `-run` 或目录前缀切：包与包之间的用例数差很多，轮流取比按名字切更均匀。
      - name: go test (race, integration)
        env:
          BLOGX_MYSQL_ADDR: 127.0.0.1:3306
          # 指向上面的 elasticsearch service：让真实索引的组合用例确定性运行，
          # 而不是回退到 testcontainers（起不来会被 t.Skipf 静默跳过）。
          BLOGX_ES_ADDR: http://127.0.0.1:9200
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./... | sort)
          total=${{ strategy.job-total }}
          idx=$(( ${{ matrix.shard }} - 1 ))
          selected=()
          for i in "${!pkgs[@]}"; do
            if (( i % total == idx )); then selected+=("${pkgs[$i]}"); fi
          done
          echo "本片 ${#selected[@]} / ${#pkgs[@]} 个包"
          go test -race -tags integration -count=1 -timeout 25m "${selected[@]}"

  # ── 架构守卫：AST 规则（先 warn，逐步升级 error）─────────────────
  archcheck:
    name: backend (archcheck)
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Go 构建缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            gobuild-${{ runner.os }}-

      # 规则自检 + 棘轮两遍都登记在仓库级门禁清单（scripts/gates/gates.json）：
      # 本地 check.sh、CI、门禁自检都经 scripts/gates/run.mjs 读同一份。
      # 棘轮阈值只从 scripts/arch-baseline.env 读出后由 runner 填进命令 ——
      # 这里绝不写死数字；之前 CI 停在 250 而本地已是 0，棘轮就失去了意义。
      - name: archcheck（规则自检 + 棘轮两遍）
        working-directory: .
        run: node scripts/gates/run.mjs --group backend

  # ── 契约：生成产物必须与代码注解一致 ────────────────────────────────
  # 为什么需要这个 job：契约是前后端唯一的耦合点。有人改了 Go 注解却忘了
  # 跑 `make openapi`，docs/swagger.json 就会静默过期，前端类型照着过期契约
  # 生成 —— 门禁全绿，但契约是错的，而且没有任何信号。
  #
  # 判据与本地门禁 / 门禁自检共用 scripts/check-contract-freshness.mjs：
  # 生成到临时目录逐字比对 + 条目数量不下降 + 本次新增结构在场；
  # 不再用 git diff --exit-code（工作区脏会假红，且看不出静默跳过）。
  contract:
    name: backend (contract up-to-date)
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Go 构建缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            gobuild-${{ runner.os }}-

      # 判定实现是仓库级 .mjs 脚本，显式装 Node 而不是依赖 runner 预装版本。
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 安装 ref 只从仓库级 scripts/tool-versions.env 读（经 scripts/gates/install.mjs
      # 这唯一入口，本地与门禁自检同一条命令）；判定实现还会核对已安装二进制的
      # go version -m 构建信息，避免"装了别的版本却全绿"。
      - name: 安装契约生成工具（单一版本来源）
        working-directory: .
        run: node scripts/gates/install.mjs swag

      # 先把依赖下全，再让 swag 跑。
      #
      # 不加这一步会偶发失败在 `cannot find all dependencies, <nil>`：
      # swag 带 --parseDependency 时会自己调 `go list -deps`，而这次调用与
      # 模块下载是并发的（日志里能看到一堆 go: downloading 之后立刻报错）。
      # 下载慢一点或者有一次抖动，解析就拿到不完整的依赖图 —— 而 swag 的报错
      # 只说"找不到依赖"，看不出是网络问题，非常容易误判成注解写错。
      # 单独一步下载，失败原因就落在这一步，且失败会明确指着 go.sum。
      - name: 下载 Go 依赖
        working-directory: .
        run: node scripts/gates/install.mjs go-mod --dir backend

      # 判定实现仍是 scripts/check-contract-freshness.mjs（#273）：这里只按清单
      # 里的分组调它，与本地门禁、门禁自检第 5 节跨同一个实现。
      # 用分组而不是写死 gate id：清单里 contract 组的门禁增删（例如判定行为用例）
      # 不用回来改这个 job。
      - name: 契约未过期判定（生成到临时文件逐字比对）
        working-directory: .
        run: node scripts/gates/run.mjs --group contract

  # ── 前端 lint（两端解耦，矩阵并行）────────────────────────────────
  frontend-lint:
    name: ${{ matrix.app }} (lint)
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend_admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # 固定时区。runner 默认 UTC，而前端有用例断言"某个时刻显示成 3 点"——
    # 同一份 +08:00 的输入在 UTC 下会被换算成前一天 19 点，于是本地绿、CI 红。
    # 这四个前端 job 统一钉成东八区，让时间断言的语义与项目实际部署时区一致。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - run: node ../scripts/gates/install.mjs pnpm

      # 后台的用例与预览会跨包 import 读者站的纯函数（`../frontend/app/utils/*`），
      # 那些模块自己 import 了读者站独有的依赖（如 `isomorphic-dompurify`）。
      # 两个前端不是同一个 pnpm workspace，所以后台 job 里必须把读者站的依赖也装上，
      # 否则在 import 链上会解析不到（本地因为两边都装过所以看不出来）。
      - name: 安装读者站依赖（后台跨包 import 需要）
        if: matrix.app == 'frontend_admin'
        run: node ../scripts/gates/install.mjs pnpm
        working-directory: frontend

      - name: pnpm lint
        run: pnpm lint

      # 模板里的自定义组件能不能解析到。这类缺陷 lint / vue-tsc / vitest 都看不见：
      # components/settings/AiProviderList.vue 实际注册名是 SettingsAiProviderList，
      # 组件里写 <AiProviderList /> 编译与类型都不报错，只在运行时 resolveComponent
      # 失败 → 整块 UI 静默不渲染（线上「AI 模型配置」就这样消失过）。
      # 依赖 pnpm install 触发的 nuxt prepare 生成 .nuxt/components.d.ts。
      - name: 模板组件解析检查
        run: pnpm check:components

      # 设计 token 漂移门禁：app/** 不许出现裸 hex / rgba，颜色只能来自 tokens.css
      # 的语义层。baseline 已在 #13 清空为 0 —— 此后任何新增裸色值直接失败。
      # 与本地 scripts/check.sh 的 frontend 段保持同一口径（不在这里另写一份规则）。
      - name: 设计 token 漂移检查
        run: pnpm check:tokens

      # 仓库级判据（两端 tokens.css 逐字节同源 = ADR-0012 约束 14 / #22；
      # 两端 imageShaping 定形工具与裁剪窗四份组件逐字节同源 = #200 / #225）。
      # 命令登记在 scripts/gates/gates.json 这一处清单里，与本地 scripts/check.sh
      # 的「仓库级门禁（两端 token / 同源副本）」跨同一个 runner；矩阵里只跑一份。
      - name: 仓库级门禁（两端 token / 同源副本）
        if: matrix.app == 'frontend'
        working-directory: .
        run: node scripts/gates/run.mjs --group frontend

      # 一张参数表生成四端消费物并进入契约（开放接口契约）；#286 退掉范围门禁，
      # 只留「重新生成后四端无差异 + 运行时取值正确」这一条校验。
      # 它是参数生成脚本，按 #287 AC4 不属于「清单 / 版本 / 判定 / 重复安装」
      # 四件事，因此仍在门禁清单之外（gates.json 的 notGates 登记第 14 节），
      # 由这里与 check.sh 的 gates 段、verify-gates.sh 第 14 节直接调用。
      - name: 生成式装饰参数校验
        if: matrix.app == 'frontend'
        working-directory: .
        run: node scripts/generate-deco-parameters.mjs --check

  # ── 前端类型检查 ──────────────────────────────────────────────────
  frontend-typecheck:
    name: ${{ matrix.app }} (typecheck)
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend_admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # 固定时区，理由见 frontend-lint 里的说明。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - run: node ../scripts/gates/install.mjs pnpm

      # 后台的用例与预览会跨包 import 读者站的纯函数（`../frontend/app/utils/*`），
      # 那些模块自己 import 了读者站独有的依赖（如 `isomorphic-dompurify`）。
      # 两个前端不是同一个 pnpm workspace，所以后台 job 里必须把读者站的依赖也装上，
      # 否则在 import 链上会解析不到（本地因为两边都装过所以看不出来）。
      - name: 安装读者站依赖（后台跨包 import 需要）
        if: matrix.app == 'frontend_admin'
        run: node ../scripts/gates/install.mjs pnpm
        working-directory: frontend

      - run: pnpm typecheck

  # ── 契约 → 前端派生类型：必须重新生成过 ──────────────────────────
  # 上一个 job 保证 swagger.json 与 Go 注解一致；这个 job 保证两个 app 的
  # app/types/openapi.d.ts 是从这份 swagger.json 生成的。
  #
  # 为什么需要两个 job：只校验 swagger.json 时，改了注解 → 生成契约 → 忘了
  # `pnpm openapi:types`，门禁全绿而前端仍照着旧类型编译。
  # 那正是"契约过期"的失效模式，只是下移了一层（从 .go 移到 .d.ts）。
  contract-types:
    name: ${{ matrix.app }} (contract types up-to-date)
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend_admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # 固定时区，理由见 frontend-lint 里的说明。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - run: node ../scripts/gates/install.mjs pnpm

      # 后台的用例与预览会跨包 import 读者站的纯函数（`../frontend/app/utils/*`），
      # 那些模块自己 import 了读者站独有的依赖（如 `isomorphic-dompurify`）。
      # 两个前端不是同一个 pnpm workspace，所以后台 job 里必须把读者站的依赖也装上，
      # 否则在 import 链上会解析不到（本地因为两边都装过所以看不出来）。
      - name: 安装读者站依赖（后台跨包 import 需要）
        if: matrix.app == 'frontend_admin'
        run: node ../scripts/gates/install.mjs pnpm
        working-directory: frontend

      # 重新生成到临时文件再比对（不是在原地生成后 git diff）：
      # 后者把结论绑在工作区状态上，且会改动被检查的文件。
      - name: 重新生成契约类型到临时文件
        run: pnpm exec openapi-typescript ../backend/docs/swagger.json -o /tmp/openapi.d.ts

      - name: 必须与提交内容一致
        run: |
          if ! diff -q /tmp/openapi.d.ts app/types/openapi.d.ts; then
            echo ""
            echo "✗ app/types/openapi.d.ts 与 backend/docs/swagger.json 不一致。"
            echo "  请在本地执行 cd ${{ matrix.app }} && pnpm openapi:types 并把产物一起提交。"
            echo "  否则前端会照着过期契约编译，而门禁却全绿。"
            echo ""
            diff -u app/types/openapi.d.ts /tmp/openapi.d.ts | head -40
            exit 1
          fi

  # ── 前端单测 ──────────────────────────────────────────────────────
  frontend-test:
    name: ${{ matrix.app }} (test)
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, frontend_admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    # 固定时区，理由见 frontend-lint 里的说明。
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml

      - run: node ../scripts/gates/install.mjs pnpm

      # 后台的用例与预览会跨包 import 读者站的纯函数（`../frontend/app/utils/*`），
      # 那些模块自己 import 了读者站独有的依赖（如 `isomorphic-dompurify`）。
      # 两个前端不是同一个 pnpm workspace，所以后台 job 里必须把读者站的依赖也装上，
      # 否则在 import 链上会解析不到（本地因为两边都装过所以看不出来）。
      - name: 安装读者站依赖（后台跨包 import 需要）
        if: matrix.app == 'frontend_admin'
        run: node ../scripts/gates/install.mjs pnpm
        working-directory: frontend

      # 跑测试并卡覆盖率门槛（两端配置各自的统计范围）。
      # 曾经这里只跑 `pnpm test`：管理后台 0 用例 + passWithNoTests，
      # 那一项等于空转 —— 门禁给了一个它并没有提供的保障。
      - run: pnpm test:coverage

  # ── 门禁自检：故意注入失败，CI 必须变红 ───────────────────────────
  # 这个 job 存在的意义：证明上面所有 job 真的会失败。
  # 如果它们只是"永远绿"，那么整套 CI 等于不存在。
  gates-canary:
    name: gates canary (must fail)
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.run == 'true' && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # 下面"判断是否触到门禁自身"要跑 `git diff origin/<base>...HEAD`，
          # 需要完整的 base 引用；只对这一个 job 打开全量历史（仓库不大）。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - name: Go 构建缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            gobuild-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}-
            gobuild-${{ runner.os }}-

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 门禁自检一次要跑好几分钟，所以只在两种情况下跑：
      #   1) 作者在 PR 标题写 [canary] —— 人工指定"这次要验门禁"；
      #   2) 本次 PR 改到了**门禁自身**（scripts/ 下的门禁与基线、workflow、vitest 阈值）。
      #
      # 第 2 条是补一个真实漏洞：此前只看标题，于是"改了门禁却没人验门禁"能一路飘过去。
      # 2026-10-31 实测：verify-gates.sh 第 11 节的注入假设已过期（admin 覆盖率与文件数
      # 增长后，注入一个零覆盖文件掉不到 95 门槛），但因为没人跑它，PR 上的
      # `gates canary` 显示 pass 而实际 step 被 skip —— 门禁给了它并没有提供的保障。
      - name: 判断本次改动是否触到门禁自身
        id: gate-changes
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base...HEAD" || true)"
          printf '%s\n' "$changed" | sed 's/^/  改动: /'
          if printf '%s\n' "$changed" \
            | grep -Eq '^(scripts/|\.github/workflows/)|vitest\.config\.ts$'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      # 这里**调用与本地同一个脚本**，而不是在 YAML 里另写一份注入逻辑。
      # 之前 CI 只注入了"一个必败测试"，等于 13 道门禁里只验证了 1 道 ——
      # 而两处各写一份的必然结果是口径漂移（本地 13 道、CI 1 道，没人知道该信哪个）。
      - name: 门禁自检（注入违规后门禁必须变红）
        if: >-
          contains(github.event.pull_request.title, '[canary]') ||
          steps.gate-changes.outputs.should_run == 'true'
        env:
          CGO_ENABLED: "1"
        run: |
          # 工具版本与安装步骤只有一处定义（scripts/tool-versions.env + install.mjs），
          # 与本地门禁、contract job 同一条命令，不在这里另拼版本字面量。
          node scripts/gates/install.mjs swag
          # 自检第 5 节会跑 `make openapi`，而 swag 带 --parseDependency 时自己会调
          # `go list -deps`；若不先把模块下全，它会与下载并发、偶发报
          # `cannot find all dependencies, <nil>`，让自检误判成"契约生成失败"。
          # 常规 contract job 正是靠一个独立的 `go mod download` 步骤规避这一点
          # （Makefile 上方注释也记了同一个坑）；自检 job 此前从未真跑过，所以没暴露。
          node scripts/gates/install.mjs go-mod --dir backend
          node scripts/gates/install.mjs pnpm --dir frontend
          node scripts/gates/install.mjs pnpm --dir frontend_admin
          # 门禁自检本身：脚本开头会先按清单核对「每道门禁都有演练」，
          # 再逐节注入违规；它不接受任何整体跳过参数。
          bash scripts/verify-gates.sh
